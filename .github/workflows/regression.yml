# Runs the same check as ./scripts/regression_check.sh on every push (any branch) and pull request.
name: Regression check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # Apple Silicon with Xcode 26 (Swift 6.2). The check downloads the pinned arm64 ffmpeg itself.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Regression check
        run: ./scripts/regression_check.sh
